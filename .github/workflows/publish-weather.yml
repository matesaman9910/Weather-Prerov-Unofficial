name: Publish Přerov weather

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 0 * * *"
      timezone: "Europe/Prague"
  workflow_dispatch:

concurrency:
  group: prerov-weather-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run deterministic tests
        run: node --test

      - name: Recover the currently deployed daily lock
        id: previous
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/fetch-previous-snapshot.mjs \
            "${PAGES_BASE_URL%/}/data/daily-snapshot.json" \
            data/previous-daily-snapshot.json
          if test -f data/previous-daily-snapshot.json; then
            echo "args=--previous data/previous-daily-snapshot.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and validate daily snapshot
        run: node scripts/generate-daily-snapshot.mjs ${{ steps.previous.outputs.args }}

      - name: Prepare static site artifact
        run: node scripts/prepare-site.mjs _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
